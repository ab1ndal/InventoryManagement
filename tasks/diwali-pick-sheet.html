<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diwali Pick Sheet</title><style>
:root{--gold:#A16207;--ink:#1C1917;--muted:#78716C;--line:#D6D3D1;--bg:#FAFAF9}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:16px;margin:0 12px 0 0}#count{font-weight:700;color:var(--gold)}
button{font:inherit;padding:6px 12px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer}button.primary{background:var(--gold);color:#fff}
p.help{margin:8px 16px;color:var(--muted);font-size:13px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px 16px}
.card{display:block;background:#fff;border:2px solid var(--line);cursor:pointer;position:relative}
.card:has(input:checked){border-color:var(--gold)}
.card input{position:absolute;top:8px;left:8px;width:20px;height:20px;z-index:1;accent-color:var(--gold)}
.frame{aspect-ratio:3/4;overflow:hidden;background:var(--bg)}.frame img{width:100%;height:100%;object-fit:cover;object-position:top}
.meta{font-size:12px;padding:6px 8px;line-height:1.5}.score{color:var(--muted)}
textarea{width:calc(100% - 32px);margin:0 16px 16px;height:90px;font-family:ui-monospace,monospace;font-size:12px}
</style></head><body>

<textarea id="out" readonly></textarea>
<script>
const KEY="diwali-picks-v1", boxes=[...document.querySelectorAll("input[type=checkbox]")];
const auto=boxes.filter(b=>b.defaultChecked).map(b=>b.value);
function save(){try{localStorage.setItem(KEY,JSON.stringify(boxes.filter(b=>b.checked).map(b=>b.value)))}catch(e){}}
function render(){const ids=boxes.filter(b=>b.checked).map(b=>b.value);document.getElementById("count").textContent=ids.length;document.getElementById("out").value=JSON.stringify(ids)}
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(saved))boxes.forEach(b=>b.checked=saved.includes(b.value))}catch(e){}
boxes.forEach(b=>b.addEventListener("change",()=>{save();render()}));
document.getElementById("reset").onclick=()=>{boxes.forEach(b=>b.checked=auto.includes(b.value));save();render()};
document.getElementById("copy").onclick=async()=>{const t=document.getElementById("out");t.select();try{await navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}document.getElementById("copy").textContent="Copied";setTimeout(()=>document.getElementById("copy").textContent="Copy picked IDs",1500)};
render();
</script></body></html>
